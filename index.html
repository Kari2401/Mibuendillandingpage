<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiBuendil Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #FFFFFF;
            color: #333;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .left-column {
            width: 50%;
            padding: 25px;
            display: flex;
            flex-direction: column;
            background-image: url('V5.png');
            background-size: cover;
            background-position: center;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .header img {
            height: 80px;
        }

        .header h1 {
            font-size: 20px;
            color: #555;
            margin: 0;
            line-height: 1.2;
        }

        .hero {
            text-align: left;
            margin-bottom: 10px;
        }

        .hero h1 {
            font-size: 40px;
            color: #629D9A;
            margin: 5px 0;
            line-height: 1.1;
            font-weight: 600;
        }

        .right-column {
            width: 50%;
            padding: 25px;
            background-image: url('F2.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 10px;
        }

        .form-container h2 {
            font-size: 42px;
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .demo-button,
        .form-container button {
            font-size: 21.5px;
            padding: 12px;
            width: 60%;
            max-width: 300px;
            margin: 0 auto;
            border-radius: 5px;
            background-color: #E6B54A;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: block;
            font-weight: bold;
        }

        .demo-button:hover,
        .form-container button:hover {
            background-color: #d0a04a;
        }

        .video-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .video-container {
            position: relative;
            width: 90%;
            max-width: 1280px;
            background: #000;
            display: flex;
            justify-content: center;
        }

        .video-container iframe {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
        }

        .close-video {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background-color: #E6B54A;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
        }

        .close-video:hover {
            background-color: #d0a04a;
        }

        @media screen and (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .left-column {
                width: 100%;
                background-image: none; /* Oculta la imagen */
            }

            .right-column {
                width: 100%;
            }

            .hero h1 {
                font-size: 28px;
                text-align: center;
            }

            .form-container {
                padding: 15px;
            }

            .demo-button {
                width: 100%;
                font-size: 18px;
            }

            .video-container iframe {
                aspect-ratio: 16 / 9;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-column">
            <div class="header">
                <img src="7.jpg" alt="MiBuendil Logo">
                <h1>La vitrina digital que impulsará tus ventas</h1>
            </div>
            <div class="hero">
                <h1>Multiplica tus ventas sin riesgo ni inversión inicial</h1>
            </div>
        </div>

        <div class="right-column">
            <div class="form-container">
                <a href="https://www.mibuendil.com/" class="demo-button">Revisa nuestra demo</a>
            </div>
        </div>
    </div>

    <div id="videoPopup" class="video-popup">
        <div class="video-container">
            <button class="close-video" onclick="closeVideo()">×</button>
            <iframe id="youtubeVideo" src="https://www.youtube.com/embed/dSDPTrKegNs?autoplay=1&controls=1&rel=0&showinfo=0" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function openVideo() {
            const popup = document.getElementById('videoPopup');
            popup.style.display = 'flex';
        }

        function closeVideo() {
            const popup = document.getElementById('videoPopup');
            popup.style.display = 'none';
            const iframe = document.getElementById('youtubeVideo');
            iframe.src = iframe.src; // Reinicia el video
        }

        document.addEventListener('DOMContentLoaded', () => {
            openVideo();
        });
    </script>
</body>
</html>
